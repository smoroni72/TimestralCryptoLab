[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timestral-crypto-lab"
version = "0.1.0"
requires-python = ">=3.12"
description = "Offline spot OHLCV acquisition and validation for M1"
dependencies = ["pyarrow==23.0.1"]

[project.scripts]
tcl-data = "timestral_crypto_lab.data:main"

[tool.setuptools.packages.find]
where = ["src"]
